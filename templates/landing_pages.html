{{define "body"}}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Landing Pages</h1>
    <button type="button" class="btn btn-primary" id="new_button"><i class="bi bi-plus-lg me-1"></i>New Page</button>
</div>

<div id="flashes"></div>

<div id="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
</div>

<div id="emptyMessage" class="d-none">
    <div class="alert alert-info">No pages created yet. Let's create one!</div>
</div>

<div class="card d-none" id="pagesCard">
    <div class="card-body">
        <div id="pagesTable"></div>
    </div>
</div>

<!-- Page modal -->
<div class="modal fade" id="pageModal" tabindex="-1" aria-labelledby="pageModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="pageModalLabel">New Landing Page</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="modal.flashes"></div>

                <div class="mb-3">
                    <label class="form-label" for="name">Name</label>
                    <input type="text" class="form-control" placeholder="Page name" id="name" autofocus>
                </div>

                <!-- Import Site (inline, no nested modal) -->
                <div class="mb-3">
                    <label class="form-label" for="url">Import site</label>
                    <div class="input-group">
                        <input type="text" class="form-control" placeholder="https://example.com" id="url">
                        <button class="btn btn-outline-secondary" type="button" id="importSiteBtn">
                            <i class="bi bi-globe me-1"></i>Import
                        </button>
                    </div>
                    <div class="form-text">Fetches the page's HTML into the editor below.</div>
                </div>

                <!-- HTML editor + preview -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label mb-0">HTML</label>
                        <div class="btn-group btn-group-sm" role="group">
                            <button type="button" class="btn btn-outline-secondary active" id="editorTabBtn">
                                <i class="bi bi-code-slash me-1"></i>Source
                            </button>
                            <button type="button" class="btn btn-outline-secondary" id="previewTabBtn">
                                <i class="bi bi-eye me-1"></i>Preview
                            </button>
                        </div>
                    </div>
                    <div id="htmlEditor" class="border rounded" style="height: 360px; overflow: auto;"></div>
                    <iframe id="htmlPreview" class="border rounded w-100 d-none" style="height: 360px;"
                        title="Landing page preview" sandbox=""></iframe>
                </div>

                <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" id="capture_credentials_checkbox">
                    <label class="form-check-label" for="capture_credentials_checkbox">
                        Capture Submitted Data
                        <i class="bi bi-question-circle" data-bs-toggle="tooltip"
                            title="If the landing page contains a form, submitted input (except passwords!) will be captured."></i>
                    </label>
                </div>

                <div class="d-none" id="capture_passwords">
                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" id="capture_passwords_checkbox">
                        <label class="form-check-label" for="capture_passwords_checkbox">Capture Passwords</label>
                    </div>
                    <div class="alert alert-warning">
                        <i class="bi bi-exclamation-triangle me-1"></i><b>Warning:</b> Credentials are currently
                        <b>not encrypted</b>. Captured passwords are stored in the database as cleartext.
                    </div>
                </div>

                <div class="d-none mb-2" id="redirect_url">
                    <label class="form-label" for="redirect_url_input">
                        Redirect to
                        <i class="bi bi-question-circle" data-bs-toggle="tooltip"
                            title="Redirect the user to this page after data is submitted."></i>
                    </label>
                    <input id="redirect_url_input" class="form-control" placeholder="https://example.com">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="modalSubmit">Save Page</button>
            </div>
        </div>
    </div>
</div>
{{end}}
{{define "scripts"}}
<script type="module" src="/dist/landing_pages.js"></script>
{{end}}
