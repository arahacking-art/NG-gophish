{{define "body"}}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Users &amp; Groups</h1>
    <button type="button" class="btn btn-primary" id="new_button">
        <i class="bi bi-plus-lg me-1"></i>New Group
    </button>
</div>

<div id="flashes"></div>

<div id="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
</div>

<div id="emptyMessage" class="d-none">
    <div class="alert alert-info">No groups created yet. Let's create one!</div>
</div>

<div class="card d-none" id="groupCard">
    <div class="card-body">
        <div id="groupTable"></div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="groupModal" tabindex="-1" aria-labelledby="groupModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="groupModalLabel">New Group</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="modal.flashes"></div>

                <div class="mb-3">
                    <label class="form-label" for="name">Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Group name" autofocus>
                </div>

                <div class="d-flex align-items-center gap-3 mb-3">
                    <label class="btn btn-outline-secondary mb-0" for="csvupload">
                        <i class="bi bi-filetype-csv me-1"></i> Bulk Import Users
                        <input type="file" id="csvupload" accept=".csv,.txt" hidden>
                    </label>
                    <a href="#" id="csv-template" class="small text-decoration-none">
                        <i class="bi bi-download me-1"></i>Download CSV Template
                    </a>
                </div>

                <form id="targetForm" class="row g-2 align-items-end mb-3">
                    <div class="col-6 col-md-3">
                        <input type="text" class="form-control form-control-sm" placeholder="First Name" id="firstName">
                    </div>
                    <div class="col-6 col-md-3">
                        <input type="text" class="form-control form-control-sm" placeholder="Last Name" id="lastName">
                    </div>
                    <div class="col-7 col-md-3">
                        <input type="email" class="form-control form-control-sm" placeholder="Email" id="email" required>
                    </div>
                    <div class="col-5 col-md-2">
                        <input type="text" class="form-control form-control-sm" placeholder="Position" id="position">
                    </div>
                    <div class="col-12 col-md-1 d-grid">
                        <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i></button>
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table table-sm table-hover align-middle">
                        <thead>
                            <tr>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Email</th>
                                <th>Position</th>
                                <th class="text-end">#<span id="targetCount">0</span></th>
                            </tr>
                        </thead>
                        <tbody id="targetsBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="modalSubmit">Save changes</button>
            </div>
        </div>
    </div>
</div>
{{end}}
{{define "scripts"}}
<script type="module" src="/dist/groups.js"></script>
{{end}}
