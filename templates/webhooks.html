{{define "body"}}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">{{.Title}}</h1>
    <button type="button" class="btn btn-primary" id="new_button">
        <i class="bi bi-plus-lg me-1"></i> New Webhook
    </button>
</div>

<div id="flashes" class="mb-3"></div>

<div class="card">
    <div class="card-body">
        <div id="webhookTable"></div>
    </div>
</div>

<!-- Add / Edit modal -->
<div class="modal fade" id="webhookModal" tabindex="-1" aria-labelledby="webhookModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="webhookModalLabel">Add or Edit Webhook</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="modal.flashes" class="mb-2"></div>
                <div class="mb-3">
                    <label class="form-label" for="name">Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Name" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="url">URL</label>
                    <input type="text" class="form-control" id="url" placeholder="https://example.com/webhook1" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="secret">Secret</label>
                    <input type="text" class="form-control" id="secret" placeholder="Secret" required>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="is_active" value="true">
                    <label class="form-check-label" for="is_active">
                        Is active
                        <i class="bi bi-question-circle" data-bs-toggle="tooltip" data-bs-placement="right"
                            title="Data is sent only to the active webhooks"></i>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="modalSubmit">Save changes</button>
            </div>
        </div>
    </div>
</div>
{{end}}

{{define "scripts"}}
<link rel="stylesheet" href="/dist/webhooks.css">
<script type="module" src="/dist/webhooks.js"></script>
{{end}}
