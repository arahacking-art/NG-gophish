{{ define "base" }}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NG-gophish - Phishing Toolkit">
    <link rel="shortcut icon" href="/images/favicon.ico">

    <title>Gophish - {{ .Title }}</title>

    <script>
        (function () {
            var theme = null;
            try { theme = localStorage.getItem('ng-theme'); } catch (e) {}
            if (!theme) {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>

    <link href='https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,600,700' rel='stylesheet' type='text/css'>
    <link href="/dist/main.css" rel="stylesheet">
</head>

<body class="ng-auth">
    <button type="button" class="btn btn-outline-secondary ng-theme-toggle" data-ng-theme-toggle
        aria-label="Cambiar tema">
        <i class="bi bi-moon-stars-fill"></i>
    </button>

    <main class="ng-auth-main">
        <div class="card ng-auth-card">
            <div class="card-body p-4 p-sm-5">
                <div class="text-center mb-4">
                    <img class="ng-auth-logo mb-3" src="/images/logo_purple.png" alt="Gophish">
                    <h1 class="h4 fw-semibold mb-1">Reset your password</h1>
                    <p class="text-body-secondary small mb-0">Choose a new password to continue</p>
                </div>

                {{template "flashes" .Flashes}}

                <form action="" method="POST" novalidate>
                    <div class="form-floating mb-2">
                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Password" autocomplete="new-password" minlength="8" required autofocus>
                        <label for="password"><i class="bi bi-lock me-1"></i> New password</label>
                    </div>

                    <div id="password-strength-container" class="mb-3 d-none">
                        <div class="progress" style="height: 6px;">
                            <div id="password-strength-bar" class="progress-bar" role="progressbar"
                                aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                        <small id="password-strength-description" class="d-block mt-1"></small>
                    </div>

                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                            placeholder="Confirm Password" autocomplete="new-password" minlength="8" required>
                        <label for="confirm_password"><i class="bi bi-lock-fill me-1"></i> Confirm password</label>
                    </div>

                    <input type="hidden" name="csrf_token" value="{{.Token}}" />
                    <button class="btn btn-primary btn-lg w-100" type="submit">
                        <i class="bi bi-check2-circle me-1"></i> Save password
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a class="small text-body-secondary" href="/logout"><i class="bi bi-box-arrow-right me-1"></i>
                        Logout</a>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="/dist/reset_password.js"></script>
</body>

</html>
{{ end }}
