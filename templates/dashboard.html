{{define "body"}}
<h1 class="h3 mb-4">Dashboard</h1>

<div id="flashes">{{template "flashes" .Flashes}}</div>

<div id="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
</div>

<div id="emptyMessage" class="d-none">
    <div class="alert alert-info">No campaigns created yet. <a href="/campaigns" class="alert-link">Let's create
            one!</a></div>
</div>

<div id="dashboard" class="d-none">
    <div class="card mb-4">
        <div class="card-body">
            <div id="overview_chart" style="height:260px;"></div>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-6 col-md">
            <div class="card h-100"><div class="card-body p-2"><div id="sent_chart" style="height:150px;"></div></div></div>
        </div>
        <div class="col-6 col-md">
            <div class="card h-100"><div class="card-body p-2"><div id="opened_chart" style="height:150px;"></div></div></div>
        </div>
        <div class="col-6 col-md">
            <div class="card h-100"><div class="card-body p-2"><div id="clicked_chart" style="height:150px;"></div></div></div>
        </div>
        <div class="col-6 col-md">
            <div class="card h-100"><div class="card-body p-2"><div id="submitted_data_chart" style="height:150px;"></div></div></div>
        </div>
        <div class="col-6 col-md">
            <div class="card h-100"><div class="card-body p-2"><div id="email_reported_chart" style="height:150px;"></div></div></div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h5 mb-0">Recent Campaigns</h2>
        <a href="/campaigns" class="btn btn-sm btn-primary"><i class="bi bi-collection me-1"></i>View All</a>
    </div>
    <div class="card">
        <div class="card-body">
            <div id="campaignTable"></div>
        </div>
    </div>
</div>
{{end}}
{{define "scripts"}}
<script type="module" src="/dist/dashboard.js"></script>
{{end}}
