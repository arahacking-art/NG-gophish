{{define "body"}}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Sending Profiles</h1>
    <button type="button" class="btn btn-primary" id="new_button"><i class="bi bi-plus-lg me-1"></i>New Profile</button>
</div>

<div id="flashes"></div>

<div id="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
</div>

<div id="emptyMessage" class="d-none">
    <div class="alert alert-info">No profiles created yet. Let's create one!</div>
</div>

<div class="card d-none" id="profileCard">
    <div class="card-body">
        <div id="profileTable"></div>
    </div>
</div>

<!-- Profile modal -->
<div class="modal fade" id="profileModal" tabindex="-1" aria-labelledby="profileModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="profileModalLabel">New Sending Profile</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="modal.flashes"></div>
                <form id="profileForm" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="name">Name</label>
                        <input type="text" class="form-control" placeholder="Profile name" id="name" autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="interface_type">Interface Type</label>
                        <input type="text" class="form-control" value="SMTP" id="interface_type" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="from">SMTP From
                            <i class="bi bi-question-circle" data-bs-toggle="tooltip"
                                title="Set this to an email address from your sending domain to bypass SPF checks."></i>
                        </label>
                        <input type="text" class="form-control" placeholder="test@example.com" id="from" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="host">Host</label>
                        <input type="text" class="form-control" placeholder="smtp.example.com:25" id="host" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="username">Username</label>
                            <input type="text" class="form-control" placeholder="Username" id="username">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="password">Password</label>
                            <input type="password" class="form-control" placeholder="Password" id="password">
                        </div>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="ignore_cert_errors" checked>
                        <label class="form-check-label" for="ignore_cert_errors">Ignore Certificate Errors
                            <i class="bi bi-question-circle" data-bs-toggle="tooltip"
                                title="Ignore common certificate errors such as self-signed certs (exposes you to MiTM attacks - use carefully!)"></i>
                        </label>
                    </div>

                    <fieldset class="mb-3">
                        <label class="form-label">Email Headers</label>
                        <div class="row g-2 align-items-end">
                            <div class="col-md-5">
                                <input type="text" class="form-control" id="headerKey" placeholder="X-Custom-Header">
                            </div>
                            <div class="col-md-5">
                                <input type="text" class="form-control" id="headerValue"
                                    placeholder='{{"{{"}}.URL{{"}}"}}-gophish'>
                            </div>
                            <div class="col-md-2">
                                <button class="btn btn-outline-primary w-100" id="addCustomHeader" type="button">
                                    <i class="bi bi-plus-lg"></i> Add
                                </button>
                            </div>
                        </div>
                        <table class="table table-sm table-hover mt-2 d-none" id="headersTable">
                            <thead>
                                <tr><th>Header</th><th>Value</th><th class="text-end"></th></tr>
                            </thead>
                            <tbody id="headersBody"></tbody>
                        </table>
                    </fieldset>

                    <button type="button" class="btn btn-outline-secondary" id="openTestEmail">
                        <i class="bi bi-envelope me-1"></i>Send Test Email
                    </button>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="modalSubmit">Save Profile</button>
            </div>
        </div>
    </div>
</div>

<!-- Send Test Email modal -->
<div class="modal fade" id="sendTestEmailModal" tabindex="-1" aria-labelledby="sendTestEmailModalTitle"
    aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="sendTestEmailModalTitle">Send Test Email</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="sendTestEmailModal.flashes"></div>
                <div class="row g-2">
                    <div class="col-sm-6">
                        <input type="text" class="form-control" placeholder="First Name" id="to_first_name">
                    </div>
                    <div class="col-sm-6">
                        <input type="text" class="form-control" placeholder="Last Name" id="to_last_name">
                    </div>
                    <div class="col-sm-8">
                        <input type="email" class="form-control" placeholder="Email" id="to_email" required>
                    </div>
                    <div class="col-sm-4">
                        <input type="text" class="form-control" placeholder="Position" id="to_position">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="sendTestModalSubmit">
                    <i class="bi bi-envelope me-1"></i>Send
                </button>
            </div>
        </div>
    </div>
</div>
{{end}}
{{define "scripts"}}
<script type="module" src="/dist/sending_profiles.js"></script>
{{end}}
