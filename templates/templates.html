{{define "body"}}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Email Templates</h1>
    <button type="button" class="btn btn-primary" id="new_button"><i class="bi bi-plus-lg me-1"></i>New Template</button>
</div>

<div id="flashes"></div>

<div id="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
</div>

<div id="emptyMessage" class="d-none">
    <div class="alert alert-info">No templates yet. Let's create one!</div>
</div>

<div class="card d-none" id="templateCard">
    <div class="card-body">
        <div id="templateTable"></div>
    </div>
</div>

<!-- Template modal -->
<div class="modal fade" id="templateModal" tabindex="-1" aria-labelledby="templateModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="templateModalLabel">New Template</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="modal.flashes"></div>
                <div class="mb-3">
                    <label class="form-label" for="name">Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Template name" autofocus>
                </div>
                <div class="mb-3">
                    <button class="btn btn-outline-secondary" type="button" id="import_email_button">
                        <i class="bi bi-envelope me-1"></i>Import Email
                    </button>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="envelope-sender">Envelope Sender
                        <i class="bi bi-question-circle" data-bs-toggle="tooltip"
                            title="Shown to the user by most email clients. Defaults to the SMTP From in the Sending Profile."></i>
                    </label>
                    <input type="text" class="form-control" id="envelope-sender" placeholder="First Last <test@example.com>">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="subject">Subject</label>
                    <input type="text" class="form-control" id="subject" placeholder="Email Subject">
                </div>

                <ul class="nav nav-tabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="text-tab" data-bs-toggle="tab" data-bs-target="#text-pane"
                            type="button" role="tab">Text</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="html-tab" data-bs-toggle="tab" data-bs-target="#html-pane"
                            type="button" role="tab">HTML</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="preview-tab" data-bs-toggle="tab" data-bs-target="#preview-pane"
                            type="button" role="tab">Preview</button>
                    </li>
                </ul>
                <div class="tab-content border border-top-0 rounded-bottom p-2 mb-3">
                    <div class="tab-pane fade show active" id="text-pane" role="tabpanel">
                        <textarea rows="12" id="text_editor" class="form-control font-monospace"
                            placeholder="Plaintext"></textarea>
                    </div>
                    <div class="tab-pane fade" id="html-pane" role="tabpanel">
                        <div id="htmlEditor" class="ng-code-editor"></div>
                    </div>
                    <div class="tab-pane fade" id="preview-pane" role="tabpanel">
                        <iframe id="htmlPreview" class="w-100 border-0 bg-white" style="height: 400px;"
                            sandbox="allow-same-origin"></iframe>
                    </div>
                </div>

                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="use_tracker_checkbox" checked>
                    <label class="form-check-label" for="use_tracker_checkbox">Add Tracking Image</label>
                </div>

                <div class="mb-2">
                    <label class="btn btn-outline-secondary mb-0">
                        <i class="bi bi-paperclip me-1"></i>Add Files
                        <input id="attachmentUpload" type="file" multiple hidden>
                    </label>
                </div>
                <table class="table table-sm align-middle">
                    <thead>
                        <tr><th style="width:2rem;"></th><th>Name</th><th style="width:3rem;"></th></tr>
                    </thead>
                    <tbody id="attachmentsBody"></tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="modalSubmit">Save Template</button>
            </div>
        </div>
    </div>
</div>

<!-- Import email modal -->
<div class="modal fade" id="importEmailModal" tabindex="-1" aria-labelledby="importEmailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="importEmailModalLabel">Import Email</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="import.flashes"></div>
                <label class="form-label" for="email_content">Email Content</label>
                <textarea rows="12" id="email_content" class="form-control font-monospace"
                    placeholder="Raw Email Source"></textarea>
                <div class="form-check form-switch mt-3">
                    <input class="form-check-input" type="checkbox" id="convert_links_checkbox" checked>
                    <label class="form-check-label" for="convert_links_checkbox">Change Links to Point to Landing
                        Page</label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="importSubmit">Import</button>
            </div>
        </div>
    </div>
</div>
{{end}}
{{define "scripts"}}
<script type="module" src="/dist/templates.js"></script>
{{end}}
