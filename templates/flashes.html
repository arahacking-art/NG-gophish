{{define "flashes"}}
	{{range .}}
		<div class="alert alert-{{.Type}} text-center" role="alert">
		<i class="bi
			{{if eq .Type "danger"}}
				bi-exclamation-circle
			{{else if eq .Type "warning"}}
				bi-exclamation-triangle
			{{else if eq .Type "success"}}
				bi-check-circle
			{{else if eq .Type "info"}}
				bi-info-circle
			{{end}}"></i>
			{{.Message}}
		</div>
	{{end}}
{{end}}
