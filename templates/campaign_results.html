{{define "body"}}
<div id="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
</div>

<div id="campaignResults" class="d-none">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0" id="page-title">Results</h1>
        <div class="btn-group">
            <a href="/campaigns" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
            <div class="btn-group">
                <button type="button" class="btn btn-primary dropdown-toggle" id="exportButton"
                    data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-filetype-csv me-1"></i>Export CSV
                </button>
                <ul class="dropdown-menu" aria-labelledby="exportButton">
                    <li><a class="dropdown-item" href="#" data-export="results">Results</a></li>
                    <li><a class="dropdown-item" href="#" data-export="events">Raw Events</a></li>
                </ul>
            </div>
            <button id="complete_button" type="button" class="btn btn-info"><i class="bi bi-flag me-1"></i>Complete</button>
            <button id="delete_button" type="button" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Delete</button>
            <button id="refresh_btn" type="button" class="btn btn-info"><i class="bi bi-arrow-clockwise me-1"></i>Refresh</button>
            <span id="refresh_message" class="btn btn-info disabled d-none">
                <span class="spinner-border spinner-border-sm me-1"></span>Refreshing
            </span>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body"><div id="timeline_chart" style="height:200px;"></div></div>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-6 col-md"><div class="card h-100"><div class="card-body p-2"><div id="sent_chart" style="height:150px;"></div></div></div></div>
        <div class="col-6 col-md"><div class="card h-100"><div class="card-body p-2"><div id="opened_chart" style="height:150px;"></div></div></div></div>
        <div class="col-6 col-md"><div class="card h-100"><div class="card-body p-2"><div id="clicked_chart" style="height:150px;"></div></div></div></div>
        <div class="col-6 col-md"><div class="card h-100"><div class="card-body p-2"><div id="submitted_data_chart" style="height:150px;"></div></div></div></div>
        <div class="col-6 col-md"><div class="card h-100"><div class="card-body p-2"><div id="reported_chart" style="height:150px;"></div></div></div></div>
    </div>

    <div class="card mb-3 d-none" id="resultsMapContainer">
        <div class="card-body">
            <h2 class="h6 text-center">Targets Map</h2>
            <div id="resultsMap" style="height:360px;"></div>
        </div>
    </div>

    <h2 class="h5 mb-2">Details</h2>
    <div class="card">
        <div class="card-body"><div id="resultsTable"></div></div>
    </div>
</div>

<div id="flashes" class="mt-3"></div>

<!-- Per-result timeline detail modal -->
<div class="modal fade" id="resultDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="resultDetailLabel">Timeline</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="resultDetailBody"></div>
        </div>
    </div>
</div>

<!-- Replay credentials URL modal -->
<div class="modal fade" id="replayModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Replay Credentials</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <label class="form-label" for="replayUrl">Where do you want the credentials submitted to?</label>
                <input type="text" class="form-control" id="replayUrl" placeholder="http://example.com/login">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="replaySubmit">Submit</button>
            </div>
        </div>
    </div>
</div>
{{end}}
{{define "scripts"}}
<script type="module" src="/dist/campaign_results.js"></script>
{{end}}
