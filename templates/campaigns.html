{{define "body"}}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Campaigns</h1>
    <button type="button" class="btn btn-primary" id="new_button">
        <i class="bi bi-plus-lg me-1"></i>New Campaign
    </button>
</div>

<div id="flashes"></div>

<ul class="nav nav-tabs mb-3" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active" id="active-tab" data-bs-toggle="tab" data-bs-target="#activeCampaigns"
            type="button" role="tab">Active</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="archived-tab" data-bs-toggle="tab" data-bs-target="#archivedCampaigns"
            type="button" role="tab">Archived</button>
    </li>
</ul>

<div id="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
</div>

<div id="emptyMessage" class="d-none">
    <div class="alert alert-info">No campaigns created yet. Let's create one!</div>
</div>

<div class="tab-content d-none" id="campaignTabs">
    <div class="tab-pane fade show active" id="activeCampaigns" role="tabpanel">
        <div class="card"><div class="card-body"><div id="campaignTable"></div></div></div>
    </div>
    <div class="tab-pane fade" id="archivedCampaigns" role="tabpanel">
        <div class="card"><div class="card-body"><div id="campaignTableArchive"></div></div></div>
    </div>
</div>

<!-- New / Copy Campaign Modal -->
<div class="modal fade" id="modal" tabindex="-1" aria-labelledby="campaignModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="campaignModalLabel">New Campaign</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="modal_body">
                <div id="modal.flashes"></div>
                <div class="mb-3">
                    <label class="form-label" for="name">Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Campaign name">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="template">Email Template</label>
                    <select class="form-select" id="template"></select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="page">Landing Page</label>
                    <select class="form-select" id="page"></select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="url">URL
                        <i class="bi bi-question-circle" data-bs-toggle="tooltip"
                            title="Location of the Gophish listener (must be reachable by targets)"></i>
                    </label>
                    <input type="text" class="form-control" id="url" placeholder="http://192.168.1.1">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="launch_date">Launch Date</label>
                        <input type="text" class="form-control" id="launch_date">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="send_by_date">Send Emails By (optional)
                            <i class="bi bi-question-circle" data-bs-toggle="tooltip"
                                title="If set, emails are sent evenly between launch and this date"></i>
                        </label>
                        <input type="text" class="form-control" id="send_by_date" autocomplete="off">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="profile">Sending Profile</label>
                    <div class="input-group">
                        <select class="form-select" id="profile"></select>
                        <button type="button" class="btn btn-outline-primary" id="sendTestEmailButton">
                            <i class="bi bi-envelope me-1"></i>Test
                        </button>
                    </div>
                </div>
                <div class="mb-2">
                    <label class="form-label" for="users">Groups</label>
                    <select class="form-select" id="users" multiple></select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" id="launchButton" class="btn btn-primary">
                    <i class="bi bi-rocket-takeoff me-1"></i>Launch Campaign
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Send Test Email Modal -->
<div class="modal fade" id="sendTestEmailModal" tabindex="-1" aria-labelledby="sendTestEmailModalTitle"
    aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="sendTestEmailModalTitle">Send Test Email</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="sendTestEmailModal.flashes"></div>
                <div class="row g-2">
                    <div class="col-6"><input type="text" class="form-control" placeholder="First Name"
                            name="to_first_name"></div>
                    <div class="col-6"><input type="text" class="form-control" placeholder="Last Name"
                            name="to_last_name"></div>
                    <div class="col-12"><input type="email" class="form-control" placeholder="Email" name="to_email"
                            required></div>
                    <div class="col-12"><input type="text" class="form-control" placeholder="Position"
                            name="to_position"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="sendTestModalSubmit">
                    <i class="bi bi-envelope me-1"></i>Send
                </button>
            </div>
        </div>
    </div>
</div>
{{end}}
{{define "scripts"}}
<script type="module" src="/dist/campaigns.js"></script>
{{end}}
