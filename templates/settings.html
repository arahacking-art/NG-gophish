{{define "body"}}
<h1 class="h3 mb-4">Settings</h1>

<div id="flashes" class="mb-3"></div>
{{template "flashes" .Flashes}}

<ul class="nav nav-tabs mb-3" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active" id="mainSettings-tab" data-bs-toggle="tab" data-bs-target="#mainSettings"
            type="button" role="tab" aria-controls="mainSettings" aria-selected="true">Account Settings</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="uiSettings-tab" data-bs-toggle="tab" data-bs-target="#uiSettings" type="button"
            role="tab" aria-controls="uiSettings" aria-selected="false">UI Settings</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="reporttab" data-bs-toggle="tab" data-bs-target="#reportingSettings" type="button"
            role="tab" aria-controls="reportingSettings" aria-selected="false">Reporting Settings</button>
    </li>
</ul>

<div class="tab-content">
    <!-- Account Settings -->
    <div role="tabpanel" class="tab-pane fade show active" id="mainSettings" aria-labelledby="mainSettings-tab">
        <div class="card">
            <div class="card-body" style="max-width: 640px;">
                {{if .ModifySystem}}
                <div class="mb-3">
                    <label class="form-label text-body-secondary">Gophish version</label>
                    <div class="fw-semibold">{{.Version}}</div>
                </div>
                {{end}}

                <form id="apiResetForm" class="mb-4">
                    <label for="api_key" class="form-label">API Key</label>
                    <div class="input-group">
                        <input type="text" id="api_key" onclick="this.select();" value="{{.User.ApiKey}}"
                            class="form-control font-monospace" readonly />
                        <button class="btn btn-outline-primary" type="submit"><i class="bi bi-arrow-repeat"></i>
                            Reset</button>
                    </div>
                    <input type="hidden" name="csrf_token" value="{{.Token}}" />
                </form>

                <form id="settingsForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" name="username" value="{{.User.Username}}"
                            class="form-control" />
                    </div>
                    <div class="mb-3">
                        <label for="current_password" class="form-label">Old Password</label>
                        <input type="password" id="current_password" name="current_password" autocomplete="off"
                            class="form-control" />
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">New Password</label>
                        <input type="password" id="password" name="new_password" autocomplete="new-password"
                            class="form-control" />
                        <div class="d-none mt-2" id="password-strength-container">
                            <div class="progress" role="progressbar" aria-label="Password strength" aria-valuenow="0"
                                aria-valuemin="0" aria-valuemax="100" style="height: 6px;">
                                <div id="password-strength-bar" class="progress-bar" style="width: 0;"></div>
                            </div>
                            <small id="password-strength-description" class="d-inline-block mt-1"></small>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_new_password" class="form-label">Confirm New Password</label>
                        <input type="password" id="confirm_new_password" name="confirm_new_password" autocomplete="off"
                            class="form-control" />
                    </div>
                    <input type="hidden" name="csrf_token" value="{{.Token}}" />
                    <button class="btn btn-primary" type="submit"><i class="bi bi-save me-1"></i> Save</button>
                </form>
            </div>
        </div>
    </div>

    <!-- UI Settings -->
    <div role="tabpanel" class="tab-pane fade" id="uiSettings" aria-labelledby="uiSettings-tab">
        <div class="card">
            <div class="card-body">
                <div class="form-check form-switch">
                    <input class="form-check-input" id="use_map" type="checkbox">
                    <label class="form-check-label" for="use_map">Show campaign results map</label>
                </div>
            </div>
        </div>
    </div>

    <!-- Reporting Settings -->
    <div role="tabpanel" class="tab-pane fade" id="reportingSettings" aria-labelledby="reporttab">
        <div class="card">
            <div class="card-body" style="max-width: 640px;">
                <form id="imapForm">
                    <p class="text-body-secondary">Monitor an IMAP account for emails reported by users.</p>

                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" id="use_imap" type="checkbox">
                        <label class="form-check-label" for="use_imap">Enable Email Account Monitoring</label>
                    </div>

                    <div class="mb-3">
                        <label for="imaphost" class="form-label">IMAP Host</label>
                        <input type="text" id="imaphost" name="imaphost" placeholder="imap.example.com"
                            class="form-control" />
                    </div>
                    <div class="mb-3">
                        <label for="imapport" class="form-label">IMAP Port</label>
                        <input type="text" id="imapport" name="imapport" placeholder="993" class="form-control" />
                    </div>
                    <div class="mb-3">
                        <label for="imapusername" class="form-label">IMAP Username</label>
                        <input type="text" id="imapusername" name="imapusername" placeholder="Username"
                            class="form-control" />
                    </div>
                    <div class="mb-3">
                        <label for="imappassword" class="form-label">IMAP Password</label>
                        <input type="password" id="imappassword" name="imappassword" placeholder="Password"
                            autocomplete="off" class="form-control" />
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" id="use_tls" type="checkbox">
                        <label class="form-check-label" for="use_tls">Use TLS</label>
                    </div>

                    <!-- Advanced Settings -->
                    <div id="advancedarea" class="d-none">
                        <hr>
                        <div class="mb-3">
                            <label for="folder" class="form-label">Folder</label>
                            <input type="text" id="folder" name="folder"
                                placeholder="Leave blank for default of INBOX." class="form-control" />
                        </div>
                        <div class="mb-3">
                            <label for="imapfreq" class="form-label" data-bs-toggle="tooltip"
                                title="How often to check for new emails. 30 seconds minimum.">Polling frequency</label>
                            <input type="number" id="imapfreq" name="imapfreq"
                                placeholder="Leave blank for default of every 60 seconds." class="form-control" />
                        </div>
                        <div class="mb-3">
                            <label for="restrictdomain" class="form-label" data-bs-toggle="tooltip"
                                title="Only check emails reported from the supplied domain.">Restrict to domain</label>
                            <input type="text" id="restrictdomain" name="restrictdomain"
                                placeholder="e.g. widgets.com. Leave blank for all domains." class="form-control" />
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" id="ignorecerterrors" type="checkbox">
                            <label class="form-check-label" for="ignorecerterrors" data-bs-toggle="tooltip"
                                title="Ignore common certificate errors such as self-signed certs (exposes you to MiTM attacks - use carefully!)">Ignore
                                Certificate Errors</label>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" id="deletecampaign" type="checkbox">
                            <label class="form-check-label" for="deletecampaign" data-bs-toggle="tooltip"
                                title="Delete campaign emails after they've been reported.">Delete campaign
                                emails</label>
                        </div>
                        <div class="mb-3" id="lastlogindiv">
                            <label for="lastlogin" class="form-label">Last successful login</label>
                            <input type="text" id="lastlogin" name="lastlogin" placeholder="Checking..." disabled
                                class="form-control" />
                        </div>
                        <input type="hidden" id="lastloginraw" name="lastloginraw" value="">
                    </div>

                    <div class="mb-3">
                        <button class="btn btn-link btn-sm px-0" id="advanced" type="button">Advanced Settings</button>
                    </div>

                    <button class="btn btn-primary" id="savesettings" type="button"><i class="bi bi-save me-1"></i>
                        Save</button>
                    <button class="btn btn-outline-secondary" id="validateimap" type="button"><i
                            class="bi bi-wrench me-1"></i> Test Settings</button>
                </form>
            </div>
        </div>
    </div>
</div>
{{end}}
{{define "scripts"}}
<script type="module" src="/dist/settings.js"></script>
{{end}}
