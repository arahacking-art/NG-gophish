{{define "body"}}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">{{.Title}}</h1>
    <button type="button" class="btn btn-primary" id="new_button">
        <i class="bi bi-plus-lg me-1"></i> New User
    </button>
</div>

<div id="flashes" class="mb-3"></div>

<div class="card">
    <div class="card-body">
        <div id="userTable"></div>
    </div>
</div>

<!-- Add / Edit modal -->
<div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="userModalLabel">New User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="modal.flashes" class="mb-2"></div>
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" class="form-control" id="username" placeholder="Username" autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" autocomplete="new-password"
                        placeholder="Password">
                    <div class="mt-2 d-none" id="password-strength-container">
                        <div class="progress" style="height: 6px;">
                            <div id="password-strength-bar" class="progress-bar" role="progressbar"
                                aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                        <small id="password-strength-description" class="d-block mt-1"></small>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirm_password">Confirm Password</label>
                    <input type="password" class="form-control" id="confirm_password" placeholder="Confirm Password">
                </div>
                <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" id="force_password_change_checkbox" checked>
                    <label class="form-check-label" for="force_password_change_checkbox">
                        Require the user to set a new password
                    </label>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="account_locked_checkbox">
                    <label class="form-check-label" for="account_locked_checkbox">Account locked</label>
                </div>
                <div>
                    <label class="form-label" for="role">Role</label>
                    <select class="form-select" id="role">
                        <option value="admin">Admin</option>
                        <option value="user">User</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="modalSubmit">Save changes</button>
            </div>
        </div>
    </div>
</div>
{{end}}

{{define "scripts"}}
<script type="module" src="/dist/users.js"></script>
{{end}}
